[project]
name = "allemmsip"
version = "1.0.0"
description = "Softphone SIP de escritorio (Windows .exe) sobre PJSIP, con la interfaz del softphone web."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-2.0-or-later" }
dependencies = []

[project.optional-dependencies]
desktop = ["pywebview>=5.0"]
dev = ["pytest>=8", "pyinstaller>=6.0"]

[project.scripts]
allemmsip = "allemmsip.desktop:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["allemmsip*"]

[tool.setuptools.package-data]
allemmsip = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
