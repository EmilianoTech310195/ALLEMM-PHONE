name: Tests (Linux, con PJSIP real)

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Caché de PJSIP compilado
        id: pjcache
        uses: actions/cache@v4
        with:
          path: pjsua2-linux
          key: pjsua2-linux-2.15.1-py312-${{ hashFiles('.github/workflows/tests.yml') }}

      - name: Compilar PJSIP + pjsua2 (Linux)
        if: steps.pjcache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y swig build-essential libssl-dev uuid-dev
          pip install setuptools wheel
          git clone --depth 1 --branch 2.15.1 https://github.com/pjsip/pjproject.git /tmp/pjproject
          cd /tmp/pjproject
          printf '#define PJ_HAS_IPV6 1\n#define PJMEDIA_HAS_SRTP 1\n#define PJSUA_MAX_CALLS 4\n#define PJSIP_DONT_SWITCH_TO_TCP 1\n' > pjlib/include/pj/config_site.h
          ./configure --disable-video --disable-libwebrtc --disable-ffmpeg --disable-sdl --disable-v4l2 --disable-openh264 --disable-vpx CFLAGS="-fPIC -O2" CXXFLAGS="-fPIC -O2"
          make dep && make -j"$(nproc)"
          cd pjsip-apps/src/swig && make -j"$(nproc)" python
          cd python && python setup.py build
          mkdir -p "$GITHUB_WORKSPACE/pjsua2-linux"
          cp build/lib.*/_pjsua2*.so build/lib.*/pjsua2.py "$GITHUB_WORKSPACE/pjsua2-linux/"

      - name: Instalar
        run: |
          pip install -e ".[dev]"
          cp pjsua2-linux/* "$(python -c 'import site;print(site.getsitepackages()[0])')/"
          python -c "import pjsua2; print(pjsua2.Endpoint().libVersion().full)"

      - run: python -m pytest -q
